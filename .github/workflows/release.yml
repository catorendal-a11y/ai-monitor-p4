name: Portable Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require tag to match firmware version
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = re.search(r'#define FW_VERSION "([^"]+)"', pathlib.Path('src/config.h').read_text()).group(1)
          assert os.environ['GITHUB_REF_NAME'] == version, 'Tag must match FW_VERSION'
          PY
      - run: python -m pip install 'platformio>=6.1,<7' -r tools/requirements.txt
      - run: python -m platformio run -e esp32p4-release
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - run: python scripts/run_tests.py --ui
      - name: Collect matching factory/application images
        run: |
          python - <<'PY'
          import pathlib, shutil
          images = pathlib.Path('.pio/build-fw/esp32p4-release')
          factory = max(images.glob('fw_*.factory.bin'), key=lambda p: p.stat().st_mtime)
          application = factory.with_name(factory.name.replace('.factory.bin', '.bin'))
          pathlib.Path('work/prebuilt').mkdir(parents=True)
          shutil.copy2(factory, 'work/prebuilt/factory.bin')
          shutil.copy2(application, 'work/prebuilt/application.bin')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-firmware
          path: work/prebuilt/*.bin
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: firmware
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: verified-firmware
          path: work/prebuilt
      - run: python -m pip install -r tools/requirements.txt -r scripts/requirements-release.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/build_windows_release.py --firmware-dir work/prebuilt
      - name: Smoke test portable executables
        shell: pwsh
        run: |
          $package = Get-ChildItem work/windows-release -Directory | Select-Object -First 1
          & (Join-Path $package.FullName 'AI-Monitor.exe') --check
          if ($LASTEXITCODE -ne 0) { throw 'Portable host failed.' }
          & (Join-Path $package.FullName 'firmware-flasher.exe') --chip esp32p4 image-info (Join-Path $package.FullName 'firmware/application.bin')
          if ($LASTEXITCODE -ne 0) { throw 'Portable flasher failed.' }
      - name: Create reviewed draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $archive = Get-ChildItem work/windows-release -Filter '*.zip' | Select-Object -First 1
          $sum = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $archive.Name
          $sums = Join-Path $archive.DirectoryName 'SHA256SUMS.txt'
          [IO.File]::WriteAllText($sums, $sum + [Environment]::NewLine)
          gh release create $env:GITHUB_REF_NAME $archive.FullName $sums --draft --title "AI Monitor P4 $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
